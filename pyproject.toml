[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "md2office"
version = "0.1.0"
description = "Convert markdown/text/HTML to PPTX, DOCX, and XLSX using template-driven deterministic rendering with optional LLM normalization."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Muhammad Danyal (Sage) Khan", email = "dan@go.ugr.es" }
]
keywords = ["markdown", "pptx", "docx", "xlsx", "converter", "template", "llm", "presentation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "python-pptx>=1.0.2",
    "python-docx>=1.1.2",
    "openpyxl>=3.1.2",
    "lxml>=5.1.0",
    "typer>=0.12.3",
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
]

[project.optional-dependencies]
openai = ["openai>=1.30.0"]
claude = ["anthropic>=0.30.0"]
groq = ["groq>=0.9.0"]
all-llm = ["openai>=1.30.0", "anthropic>=0.30.0", "groq>=0.9.0"]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
md2office = "src.cli.main:main"

[project.urls]
Homepage = "https://github.com/sage-khan/md2office"
Repository = "https://github.com/sage-khan/md2office"
"Bug Tracker" = "https://github.com/sage-khan/md2office/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
