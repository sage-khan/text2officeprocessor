# text2officeprocessor default formatting and validation rules
# These values are used as defaults; override per-project via --config flag.

pptx:
  title_max_length: 80        # Maximum characters in a slide title
  bullets_max: 6              # Maximum bullet points per slide
  min_file_size_bytes: 50000  # Below this = likely missing backgrounds

  # Content overflow handling strategy when text exceeds shape capacity
  # Options: "summarize" (LLM condense), "split" (multi-slide), "shrink" (font reduce), "auto" (LLM decides)
  overflow_strategy: "auto"

  # Shape capacity thresholds for overflow detection (characters)
  max_body_chars: 400         # Max characters in body text box before overflow handling
  max_bullet_chars: 120       # Max characters per bullet point
  max_slide_total_chars: 600  # Max total characters per slide

  # Template layout selection for text-heavy content
  # Maps content density → preferred template_index for high-capacity layouts
  high_capacity_layouts:
    - 6    # Multi Point (higher text capacity)
    - 7    # Key Highlights (4-column layout for dense content)

docx:
  preserve_headers: true      # Keep template headers/footers
  preserve_images: true       # Keep logo/brand images from template body
  list_style: "List Bullet"   # Word style name for bullet lists

xlsx:
  max_columns: 20             # Maximum columns per sheet
  freeze_header: true         # Freeze the first row as a header
  header_color: "2E75B6"      # Header cell background color (hex)

text_overflow:
  enabled: true              # Auto-shrink font size when text overflows shape bounds
  min_font_size_pt: 8        # Never shrink below this point size
  step_pt: 2                 # Reduce by this many points per iteration
  max_iterations: 20         # Safety cap on shrink iterations per shape

validation:
  strict: false               # If true, warnings are treated as errors
  check_artifacts: true       # Check for residual markdown tokens
  check_placeholders: true    # Check for unreplaced template text
  check_file_size: true       # Run file size heuristics on PPTX

# ---------------------------------------------------------------------------
# Placeholder map: intent → {template_placeholder: replacement_key}
#
# These strings are the exact text found in the template shapes that get
# replaced with user-supplied content. Override this block if your template
# uses different placeholder text.
# ---------------------------------------------------------------------------
placeholder_map:
  section_header:
    title: "Section Name Here"
    number: "SECTION Number"
  video_title:
    title: "Video Name"
    section: "Section Name"
    number: "Video Number"
  bullets:
    title: "Multi Point Slide"
    bullet_placeholders:
      - "• Bullet point one"
      - "• Bullet point two"
      - "• Bullet point three"
  single_point:
    title: "SINGLE POINT SLIDE"
    body: "This is a sample text"
  callout:
    body: "A key point (or issue)!"
  stats:
    title: "+80%"
    body: "That\u2019s how much"
  key_highlights:
    title: "Key Highlights"
    subtitle: "Enter your subhead line here"
  next_video:
    title: "Name of the Next Video"
    label: "Next Video"
  grid:
    title: "EXCELLENCE IN THE"

sanitization:
  strip_tokens:               # Markdown tokens to remove from all text runs
    - "***"
    - "**"
    - "__"
    - "---"

validation:
  strict: false               # If true, warnings are treated as errors
  check_artifacts: true       # Check for residual markdown tokens
  check_placeholders: true    # Check for unreplaced template text
  check_file_size: true       # Run file size heuristics on PPTX
  pptx_min_size_bytes: 50000  # Below this = likely missing slide backgrounds

  # Markdown artifact tokens that should NOT appear in final output
  markdown_artifacts:
    - "***"
    - "**"
    - "__"

  # Exact strings that indicate an unreplaced template placeholder
  known_placeholders:
    - "Section Name Here"
    - "SECTION Number"
    - "Video Name"
    - "Video Number"
    - "Multi Point Slide"
    - "SINGLE POINT SLIDE"
    - "Key Highlights"
    - "Key Element Title"
    - "Name of the Next Video"
    - "A key point (or issue)!"
    - "+80%"
    - "That\u2019s how much"
    - "\u2022 Bullet point one"
    - "\u2022 Bullet point two"
    - "\u2022 Bullet point three"
    - "card_1_title"
    - "card_1_body"
    - "card_2_title"
    - "card_2_body"
    - "card_3_title"
    - "card_3_body"
    - "card_4_title"
    - "card_4_body"
    - "Key Element Title"
    - "Enter your subhead line here"

llm_validation:
  max_content_chars: 8000   # Truncate document text to this length before sending to LLM
  prompt: |
    You are a quality-control assistant for office document generation.

    You will receive the extracted text content of a rendered document (PPTX, DOCX, or XLSX).
    Analyse the content and identify any of the following problems:

    1. TRUNCATED — A text run appears cut off mid-sentence or mid-word.
    2. GARBLED — A text run contains incoherent, scrambled, or clearly wrong text.
    3. PLACEHOLDER_LEAK — An unreplaced template placeholder is still visible (e.g. "Section Name Here", "Video Name").
    4. MISMATCH — The content of a section/slide does not match its heading or title.
    5. EMPTY_SECTION — A slide or section has a title but no body content at all.

    Respond ONLY with a JSON array. Each element must have:
      - "severity": "warning" or "error"
      - "location": a short description of where the issue is (e.g. "Slide 3 / title", "Section: Introduction")
      - "issue_type": one of TRUNCATED | GARBLED | PLACEHOLDER_LEAK | MISMATCH | EMPTY_SECTION
      - "message": a brief, factual description of the problem

    If there are no problems, respond with an empty array: []

    Document content:
    ---
    {content}
    ---

# ---------------------------------------------------------------------------
# LLM-powered Spreadsheet Reorganizer
# Consolidates fragmented document sections into logical Excel tables
# ---------------------------------------------------------------------------
spreadsheet_reorganizer:
  enabled: true              # Enable LLM reorganization (disable = use raw section mapping)
  max_sheets: 10             # Maximum sheets to create (prevents fragmentation)
  consolidate_threshold: 3   # If >N sections have similar structure, merge them

  # Logical table types the LLM can create
  table_types:
    - dashboard          # KPI summary with metrics
    - breakdown          # Categorized data (regional, product line, etc.)
    - timeline           # Time-series data
    - comparison         # Side-by-side comparison
    - matrix             # Risk/impact matrices
    - raw                # Preserve original structure

  # Prompt template for reorganization (variables: {document_json})
  prompt: |
    You are a data organization expert. Analyze the following document structure
    and reorganize it into logical Excel tables suitable for business analysis.

    INPUT: A document with sections, tables, and lists.
    OUTPUT: A structured plan for Excel sheets with clear table definitions.

    Rules:
    1. CONSOLIDATE related metrics into coherent tables (don't create a sheet per section)
    2. CREATE a "Dashboard" sheet with key KPIs if quantitative data exists
    3. FLATTEN hierarchical sections into table rows where appropriate
    4. PRESERVE table structure where it already exists
    5. GROUP similar data types (e.g., all regional data in one sheet)

    For each sheet, specify:
    - name: Short, descriptive sheet name (max 31 chars)
    - type: One of: dashboard | breakdown | timeline | comparison | matrix | raw
    - columns: List of column headers
    - rows: List of row data (each row is a list of cell values)
    - description: Brief explanation of what this sheet contains

    Return ONLY valid JSON in this exact format:
    {{
      "sheets": [
        {{
          "name": "Dashboard",
          "type": "dashboard",
          "columns": ["Metric", "Value", "Change"],
          "rows": [["Revenue", "$12.4M", "+28%"], ...],
          "description": "Key performance indicators summary"
        }}
      ],
      "consolidation_notes": "Brief notes on what was consolidated"
    }}

    Document structure to analyze:
    ---
    {document_json}
    ---

# ---------------------------------------------------------------------------
# PPTX Content Summarization (for overflow_strategy: "summarize")
# ---------------------------------------------------------------------------
pptx_summarizer:
  enabled: true
  max_chars_per_slide: 500
  max_bullets_per_slide: 5
  max_chars_per_bullet: 100

  prompt: |
    You are a presentation design expert. Condense the following slide content
    to fit within presentation constraints while preserving key information.

    Constraints:
    - Maximum {max_bullets} bullet points
    - Maximum {max_chars_per_bullet} characters per bullet
    - Maximum {max_total_chars} total characters for the slide

    Original content:
    ---
    {content}
    ---

    Rules:
    1. PRESERVE all key metrics and numbers
    2. CONDENSE explanatory text to essential phrases
    3. REMOVE filler words and redundant statements
    4. SPLIT into multiple slides if content cannot be condensed meaningfully
    5. RETURN concise, presentation-ready bullets

    Output format: JSON array of slides, each with {"title": "...", "bullets": [...]}
    If content fits in one slide: {{"slides": [{{"title": "...", "bullets": [...]}}]}}
    If splitting needed: {{"slides": [{{"title": "... Part 1", ...}}, {{"title": "... Part 2", ...}}]}}
