services:

  # ── text2officeprocessor ──────────────────────────────────────────────────────────────
  # Primary conversion service. Mount your working directory to /data.
  #
  # Usage:
  #   docker compose run --rm text2officeprocessor convert \
  #     --slides-md /data/slides.md \
  #     --template  /data/template.pptx \
  #     --output    /data/output.pptx \
  #     --type pptx
  text2officeprocessor:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: text2officeprocessor:latest
    volumes:
      - ${DATA_DIR:-./outputs}:/data
    environment:
      # LLM API keys — set these in a .env file, never hardcode
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      # When using the Ollama service below, this URL is pre-configured
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
        required: false
    networks:
      - text2officeprocessor-net

  # ── ollama (optional local LLM) ────────────────────────────────────────────
  # Provides a local LLM so you can use --llm ollama without any API key.
  # The service is optional — text2officeprocessor works without it using rule-based
  # normalization. Set OLLAMA_ENABLED=false to skip it.
  #
  # First run: docker compose run --rm ollama ollama pull mistral
  ollama:
    image: ollama/ollama:latest
    profiles:
      - llm
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - text2officeprocessor-net

  # ── vLLM (optional local/server OpenAI-compatible endpoint) ───────────────
  # Start with:
  #   docker compose --profile vllm up -d vllm
  #
  # Notes:
  # - Default model is Llama 3.1 8B Instruct. For gated models, set HF_TOKEN.
  # - You can override model via VLLM_MODEL in .env.
  vllm:
    image: vllm/vllm-openai:latest
    profiles:
      - vllm
    ports:
      - "8000:8000"
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - vllm-cache:/root/.cache/huggingface
    command: >
      --model ${VLLM_MODEL:-meta-llama/Llama-3.1-8B-Instruct}
      --host 0.0.0.0
      --port 8000
      --dtype auto
      --max-model-len ${VLLM_MAX_MODEL_LEN:-8192}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/models"]
      interval: 15s
      timeout: 8s
      retries: 8
      start_period: 30s
    networks:
      - text2officeprocessor-net

networks:
  text2officeprocessor-net:
    driver: bridge

volumes:
  ollama-models:
    name: text2officeprocessor-ollama-models
  vllm-cache:
    name: text2officeprocessor-vllm-cache
